name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 使う Xcode を選ぶ（いちばん新しいもの）
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: ロジックのテスト
        working-directory: RoutineCore
        run: swift test

      - name: アプリのビルド（シミュレータ向け・署名なし）
        if: hashFiles('RoutineChecker/RoutineChecker.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild -project RoutineChecker/RoutineChecker.xcodeproj -scheme RoutineChecker \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty || exit ${PIPESTATUS[0]}
